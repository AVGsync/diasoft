[package]
name = "crypto-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# ── Async runtime ──────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Kafka ──────────────────────────────────────────────────────
rdkafka = { version = "0.36", features = ["cmake-build", "tokio"] }

# ── Cryptographic hashing ──────────────────────────────────────
sha2 = "0.10"
hex  = "0.4"          # encodes digest bytes → hex string

# ── Ed25519 signing ────────────────────────────────────────────
ed25519-dalek = { version = "2", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }

# ── AES-GCM encryption ─────────────────────────────────────────
aes-gcm = "0.10"
rand = "0.8"

# ── JWT ────────────────────────────────────────────────────────
jsonwebtoken = "9"

# ── Database (Postgres, async) ─────────────────────────────────
sqlx = { version = "0.8", features = [
    "runtime-tokio", "tls-rustls",
    "postgres", "uuid", "chrono", "macros"
] }

# ── Serialization ──────────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Config / env ───────────────────────────────────────────────
config  = "0.14"
dotenvy = "0.15"

# ── Error handling ─────────────────────────────────────────────
thiserror = "2"
anyhow    = "1"

# ── Observability ──────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Utility ────────────────────────────────────────────────────
uuid   = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }