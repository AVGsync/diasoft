x-build-proxy: &build-proxy
  BUILD_HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
  BUILD_HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
  BUILD_NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1,postgres,kafka,redis,gateway-service,pubver,frontend}

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_USER: ${POSTGRES_USER:-gateway_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}

x-database-url: &database-url postgres://${POSTGRES_USER:-gateway_user}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=${POSTGRES_SSLMODE:-disable}
x-public-base-url: &public-base-url ${PUBLIC_BASE_URL:-http://localhost}
x-redis-password: &redis-password ${REDIS_PASSWORD:-}
x-jwt-secret: &jwt-secret ${JWT_SECRET:-}
x-share-jwt-secret: &share-jwt-secret ${SHARE_JWT_SECRET:-}
x-signing-keys-master-key: &signing-keys-master-key ${SIGNING_KEYS_MASTER_KEY:-}
x-qr-payload-encryption-secret: &qr-payload-encryption-secret ${QR_PAYLOAD_ENCRYPTION_SECRET:-}
x-infisical-env: &infisical-env
  INFISICAL_ENABLED: ${INFISICAL_ENABLED:-false}
  INFISICAL_API_URL: ${INFISICAL_API_URL:-https://app.infisical.com}
  INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
  INFISICAL_ENV_SLUG: ${INFISICAL_ENV_SLUG:-prod}
  INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/}
  INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
  INFISICAL_SERVICE_TOKEN: ${INFISICAL_SERVICE_TOKEN:-}
  INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-}
  INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-}
  INFISICAL_AUTH_ORGANIZATION_SLUG: ${INFISICAL_AUTH_ORGANIZATION_SLUG:-}
  INFISICAL_SECRET_TAGS: ${INFISICAL_SECRET_TAGS:-}
  INFISICAL_DISABLE_UPDATE_CHECK: ${INFISICAL_DISABLE_UPDATE_CHECK:-true}

services:
  postgres:
    image: postgres:16-alpine
    container_name: diasoft-postgres
    restart: unless-stopped
    environment:
      <<: *postgres-env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: diasoft-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic diplomas.raw_tasks --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic diplomas.processing_results --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic verification.events --partitions 1 --replication-factor 1
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: diasoft-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  redis:
    image: redis:7-alpine
    container_name: diasoft-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: *redis-password
    command:
      - /bin/sh
      - -ec
      - >
        test -n "$$REDIS_PASSWORD" ||
        { echo "REDIS_PASSWORD is required"; exit 1; };
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$REDIS_PASSWORD\" && redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-migrate:
    build:
      context: .
      dockerfile: deploy/db-migrate.Dockerfile
      args:
        <<: *build-proxy
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *infisical-env
      DATABASE_URL: *database-url
    volumes:
      - .:/workspace:ro
    restart: "no"

  gateway-service:
    build:
      context: ./gateway-service
      args:
        <<: *build-proxy
      extra_hosts:
        - "http.docker.internal:host-gateway"
    container_name: diasoft-gateway-service
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *infisical-env
      BIND_ADDR: ":8080"
      LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
      DATABASE_URL: *database-url
      JWT_SECRET: *jwt-secret
      SHARE_JWT_SECRET: *share-jwt-secret
      SIGNING_KEYS_MASTER_KEY: *signing-keys-master-key
      QR_PAYLOAD_ENCRYPTION_SECRET: *qr-payload-encryption-secret
      PUBLIC_BASE_URL: *public-base-url
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      DEMO_UNIVERSITY_NAME: ${DEMO_UNIVERSITY_NAME:-}
      DEMO_UNIVERSITY_VUZ_CODE: ${DEMO_UNIVERSITY_VUZ_CODE:-}
      DEMO_UNIVERSITY_INN: ${DEMO_UNIVERSITY_INN:-}
      DEMO_UNIVERSITY_OGRN: ${DEMO_UNIVERSITY_OGRN:-}
      DEMO_UNIVERSITY_EMAIL: ${DEMO_UNIVERSITY_EMAIL:-}
      DEMO_UNIVERSITY_PASSWORD: ${DEMO_UNIVERSITY_PASSWORD:-}
      DEMO_UNIVERSITY_PRIVATE_KEY_PATH: ${DEMO_UNIVERSITY_PRIVATE_KEY_PATH:-}
      KAFKA_BROKERS: kafka:29092
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-diplomas.raw_tasks}
      KAFKA_RESULTS_TOPIC: ${KAFKA_RESULTS_TOPIC:-diplomas.processing_results}
      KAFKA_VERIFICATION_EVENTS_TOPIC: ${KAFKA_VERIFICATION_EVENTS_TOPIC:-verification.events}
      KAFKA_VERIFICATION_EVENTS_GROUP: ${KAFKA_VERIFICATION_EVENTS_GROUP:-gateway-service-verifications}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-gateway-service}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      RATE_LIMIT_ENABLED: ${GATEWAY_RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_KEY_TTL: 15m
      RATE_LIMIT_REDIS_ADDR: redis:6379
      RATE_LIMIT_REDIS_PASSWORD: *redis-password
      RATE_LIMIT_REDIS_DB: "0"
      RATE_LIMIT_REDIS_PREFIX: rl:gateway
      CACHE_ENABLED: ${GATEWAY_CACHE_ENABLED:-true}
      CACHE_ADMIN_STATS_TTL: 30s
      CACHE_UNIVERSITIES_LIST_TTL: 1m
      CACHE_UNIVERSITY_PROFILE_TTL: 5m
      CACHE_BATCH_STATUS_TTL: 15s
      CACHE_REDIS_ADDR: redis:6379
      CACHE_REDIS_PASSWORD: *redis-password
      CACHE_REDIS_DB: "0"
      CACHE_REDIS_PREFIX: cache:gateway
    ports:
      - "8080:8080"

  cryptography-engine-rs:
    build:
      context: ./cryptography-engine-rs
      args:
        <<: *build-proxy
      extra_hosts:
        - "http.docker.internal:host-gateway"
    container_name: diasoft-cryptography-engine
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *infisical-env
      APP__KAFKA__BROKERS: kafka:29092
      APP__KAFKA__GROUP_ID: ${CRYPTO_KAFKA_GROUP_ID:-crypto-engine}
      APP__KAFKA__INPUT_TOPIC: ${KAFKA_RAW_TOPIC:-diplomas.raw_tasks}
      APP__KAFKA__OUTPUT_TOPIC: ${KAFKA_RESULTS_TOPIC:-diplomas.processing_results}
      APP__DATABASE__URL: *database-url
      APP__JWT__AUTH_HMAC_SECRET: *share-jwt-secret
      APP__JWT__PAYLOAD_SECRET: *qr-payload-encryption-secret
      APP__APP__VERIFICATION_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}/verify?payload=
      APP__APP__ENCRYPTION_KEY: *signing-keys-master-key
      RUST_LOG: ${CRYPTO_RUST_LOG:-info,rdkafka=warn,sqlx=warn}

  pubver:
    build:
      context: ./pubver
      args:
        <<: *build-proxy
      extra_hosts:
        - "http.docker.internal:host-gateway"
    container_name: diasoft-pubver
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *infisical-env
      HTTP_ADDR: ":8080"
      DATABASE_URL: *database-url
      LOG_LEVEL: ${PUBVER_LOG_LEVEL:-info}
      JWT_ENC_SECRET: *qr-payload-encryption-secret
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,172.16.0.0/12}
      RATE_LIMIT_ENABLED: ${PUBVER_RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_VERIFY_RPS: "0.25"
      RATE_LIMIT_VERIFY_BURST: "5"
      RATE_LIMIT_SEARCH_RPS: "0.1"
      RATE_LIMIT_SEARCH_BURST: "3"
      RATE_LIMIT_KEY_TTL: 15m
      RATE_LIMIT_REDIS_ADDR: redis:6379
      RATE_LIMIT_REDIS_PASSWORD: *redis-password
      RATE_LIMIT_REDIS_DB: "0"
      RATE_LIMIT_REDIS_PREFIX: rl:pubver
      ANALYTICS_ENABLED: ${PUBVER_ANALYTICS_ENABLED:-true}
      ANALYTICS_KAFKA_BROKERS: kafka:29092
      ANALYTICS_KAFKA_TOPIC: verification.events
      ANALYTICS_KAFKA_CLIENT_ID: pubver-analytics
      ANALYTICS_KAFKA_WRITE_TIMEOUT: 3s
      ANALYTICS_QUEUE_SIZE: "1024"
      ANALYTICS_GEOIP_DB_PATH: /app/geoip/GeoLite2-City.mmdb
      CACHE_ENABLED: ${PUBVER_CACHE_ENABLED:-true}
      CACHE_UNIVERSITY_KEY_TTL: 30m
      CACHE_DIPLOMA_BY_HASH_TTL: 1m
      CACHE_DIPLOMA_SEARCH_TTL: 1m
      CACHE_REDIS_ADDR: redis:6379
      CACHE_REDIS_PASSWORD: *redis-password
      CACHE_REDIS_DB: "0"
      CACHE_REDIS_PREFIX: cache:pubver
    volumes:
      - ./geoip:/app/geoip:ro
    ports:
      - "8082:8080"

  frontend:
    build:
      context: ./frontend
      extra_hosts:
        - "http.docker.internal:host-gateway"
    container_name: diasoft-frontend
    restart: unless-stopped
    depends_on:
      gateway-service:
        condition: service_started
      pubver:
        condition: service_started
    ports:
      - "80:80"

volumes:
  postgres_data:
